<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Panel - Digital Delala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --primary-light: #8B83FF;
            --secondary: #FF6584;
            --success: #2ECC71;
            --warning: #F39C12;
            --danger: #E74C3C;
            --dark: #2D3436;
            --gray-900: #2D3436;
            --gray-800: #434A4E;
            --gray-700: #636E72;
            --gray-600: #83919E;
            --gray-500: #A4B0BE;
            --gray-400: #C8D6E5;
            --gray-300: #DFE6E9;
            --gray-200: #F0F3F5;
            --gray-100: #F8FAFA;
            --white: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
            --shadow-xl: 0 16px 60px rgba(0,0,0,0.16);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--gray-100);
            color: var(--gray-900);
            line-height: 1.5;
            min-height: 100vh;
            overflow-y: auto;
        }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:var(--gray-200); }
        ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:10px; }

        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EEF2FF, #E8EDFF);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .login-screen::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(108,99,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .login-container {
            background: white;
            padding: 40px 32px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-xl);
            position: relative;
            z-index: 1;
        }
        .login-header { text-align:center; margin-bottom:28px; }
        .login-header .icon-wrap {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(108,99,255,0.25);
        }
        .login-header .icon-wrap i { font-size:28px; color:white; }
        .login-header h2 { font-size:22px; font-weight:800; }
        .login-header p { color:var(--gray-500); font-size:14px; margin-top:4px; }
        .form-group { margin-bottom:12px; }
        .form-group label {
            display: block;
            font-weight:600;
            margin-bottom:4px;
            font-size:13px;
            color:var(--gray-700);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width:100%;
            padding:8px 12px;
            border:2px solid var(--gray-300);
            border-radius:var(--radius-sm);
            font-size:14px;
            transition:var(--transition);
            background:var(--gray-100);
            font-family:inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline:none;
            border-color:var(--primary);
            background:white;
            box-shadow:0 0 0 4px rgba(108,99,255,0.08);
        }
        .btn-login {
            width:100%;
            padding:12px;
            background:linear-gradient(135deg, var(--primary), var(--primary-dark));
            color:white;
            border:none;
            border-radius:var(--radius-sm);
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:var(--transition);
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            margin-top:6px;
        }
        .btn-login:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(108,99,255,0.35);
        }

        /* ===== DASHBOARD ===== */
        .dashboard-screen { display:flex; min-height:100vh; }

        /* Sidebar – compact */
        .sidebar {
            width:200px;
            background:white;
            border-right:1px solid var(--gray-200);
            display:flex;
            flex-direction:column;
            position:fixed;
            top:0; left:0; bottom:0;
            z-index:100;
            transition:var(--transition);
        }
        .sidebar-header {
            padding:14px 16px;
            border-bottom:1px solid var(--gray-200);
            display:flex;
            align-items:center;
            gap:10px;
        }
        .sidebar-header .logo-icon {
            background:linear-gradient(135deg, var(--primary), var(--primary-light));
            width:36px;
            height:36px;
            border-radius:var(--radius-sm);
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
        }
        .sidebar-header .logo-icon i { color:white; font-size:16px; }
        .sidebar-header .brand {
            font-weight:800;
            font-size:16px;
            flex:1;
            background:linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .sidebar-header .btn-logout {
            background:none;
            border:none;
            color:var(--gray-400);
            cursor:pointer;
            font-size:16px;
            padding:6px;
            border-radius:50%;
            transition:var(--transition);
            width:32px;
            height:32px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .sidebar-header .btn-logout:hover { background:#FEE2E2; color:var(--danger); }
        .sidebar-nav {
            padding:12px 10px;
            display:flex;
            flex-direction:column;
            gap:2px;
            flex:1;
        }
        .nav-item {
            padding:10px 14px;
            border:none;
            background:none;
            border-radius:var(--radius-sm);
            display:flex;
            align-items:center;
            gap:10px;
            font-size:14px;
            font-weight:500;
            color:var(--gray-600);
            cursor:pointer;
            transition:var(--transition);
            width:100%;
            text-align:left;
        }
        .nav-item:hover { background:var(--gray-100); color:var(--gray-800); }
        .nav-item.active { background:#EEF2FF; color:var(--primary); box-shadow:inset 3px 0 0 var(--primary); }
        .nav-item i { width:18px; text-align:center; font-size:15px; }
        .nav-item .badge {
            margin-left:auto;
            background:var(--primary);
            color:white;
            font-size:10px;
            padding:1px 8px;
            border-radius:20px;
            font-weight:700;
        }

        /* Main Content – compact */
        .main-content {
            flex:1;
            margin-left:200px;
            padding:16px 24px;
            min-height:100vh;
        }
        .page-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
            flex-wrap:wrap;
            gap:8px;
        }
        .page-header h2 {
            font-size:20px;
            font-weight:700;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .page-header h2 i { color:var(--primary); }
        .btn-primary {
            padding:8px 16px;
            background:linear-gradient(135deg, var(--primary), var(--primary-dark));
            color:white;
            border:none;
            border-radius:var(--radius-sm);
            font-weight:600;
            cursor:pointer;
            transition:var(--transition);
            display:inline-flex;
            align-items:center;
            gap:6px;
            font-size:13px;
        }
        .btn-primary:hover {
            transform:translateY(-2px);
            box-shadow:0 4px 16px rgba(108,99,255,0.3);
        }
        .btn-danger {
            padding:4px 12px;
            background:#FEE2E2;
            color:var(--danger);
            border:none;
            border-radius:var(--radius-xs);
            font-weight:600;
            cursor:pointer;
            transition:var(--transition);
            font-size:12px;
        }
        .btn-danger:hover { background:var(--danger); color:white; }
        .btn-edit {
            padding:4px 12px;
            background:#EEF2FF;
            color:var(--primary);
            border:none;
            border-radius:var(--radius-xs);
            font-weight:600;
            cursor:pointer;
            transition:var(--transition);
            font-size:12px;
        }
        .btn-edit:hover { background:var(--primary); color:white; }
        .btn-success {
            padding:4px 12px;
            background:#D4EFDF;
            color:#1A7A4A;
            border:none;
            border-radius:var(--radius-xs);
            font-weight:600;
            cursor:pointer;
            transition:var(--transition);
            font-size:12px;
        }
        .btn-success:hover { background:#1A7A4A; color:white; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Stats compact */
        .stats-grid {
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
            gap:14px;
            margin-bottom:20px;
        }
        .stat-card {
            background:white;
            padding:14px 18px;
            border-radius:var(--radius);
            display:flex;
            align-items:center;
            gap:12px;
            box-shadow:var(--shadow-sm);
            border:1px solid var(--gray-200);
        }
        .stat-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
        .stat-icon {
            width:44px;
            height:44px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:16px;
            color:white;
            flex-shrink:0;
        }
        .stat-card:nth-child(1) .stat-icon { background:linear-gradient(135deg, var(--primary), var(--primary-light)); }
        .stat-card:nth-child(2) .stat-icon { background:linear-gradient(135deg, var(--success), #27AE60); }
        .stat-card:nth-child(3) .stat-icon { background:linear-gradient(135deg, var(--warning), #D68910); }
        .stat-card:nth-child(4) .stat-icon { background:linear-gradient(135deg, #8B5CF6, #7C3AED); }
        .stat-label { font-size:12px; color:var(--gray-500); font-weight:500; }
        .stat-value { font-size:20px; font-weight:800; color:var(--gray-900); line-height:1.2; }

        /* Workers & Transactions list compact */
        .workers-list, .transactions-list, .pending-list { display:flex; flex-direction:column; gap:8px; }
        .worker-item {
            background:white;
            padding:12px 16px;
            border-radius:var(--radius-sm);
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:var(--shadow-sm);
            border:1px solid var(--gray-200);
            flex-wrap:wrap;
            gap:8px;
        }
        .worker-item:hover { box-shadow:var(--shadow-md); border-color:var(--primary-light); }
        .worker-item-left { display:flex; align-items:center; gap:12px; }
        .worker-thumb {
            width:44px;
            height:44px;
            border-radius:50%;
            object-fit:cover;
            background:var(--gray-200);
            border:2px solid var(--gray-300);
            flex-shrink:0;
        }
        .worker-thumb-placeholder {
            width:44px;
            height:44px;
            border-radius:50%;
            background:linear-gradient(135deg, var(--primary), var(--primary-light));
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
            color:white;
            font-size:18px;
        }
        .worker-info .name { font-weight:700; font-size:15px; }
        .worker-info .profession { color:var(--primary); font-weight:600; font-size:13px; }
        .worker-info .details {
            font-size:13px;
            color:var(--gray-500);
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .worker-info .details span { display:flex; align-items:center; gap:3px; }
        .worker-info .details .unavailable { color:var(--danger); }
        .worker-actions { display:flex; gap:6px; }

        .transaction-item, .pending-item {
            background:white;
            padding:12px 16px;
            border-radius:var(--radius-sm);
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:var(--shadow-sm);
            border:1px solid var(--gray-200);
            flex-wrap:wrap;
            gap:8px;
        }
        .transaction-item:hover, .pending-item:hover { border-color:var(--primary-light); }
        .transaction-info .worker { font-weight:700; font-size:15px; }
        .transaction-info .boss { color:var(--gray-600); font-size:13px; }
        .transaction-info .id { font-size:12px; color:var(--gray-400); display:block; }
        .transaction-amount { font-weight:800; color:var(--primary); font-size:18px; }
        .status-badge {
            padding:2px 12px;
            border-radius:20px;
            font-size:11px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:0.3px;
        }
        .status-badge.completed { background:#D4EFDF; color:#1A7A4A; }
        .status-badge.pending { background:#FDEBD0; color:#935E38; }
        .status-badge.failed { background:#FADBD8; color:#922B21; }

        .empty-state { text-align:center; padding:40px 20px; color:var(--gray-500); }
        .empty-state i { font-size:40px; color:var(--gray-400); margin-bottom:8px; display:block; }
        .empty-state h3 { font-size:18px; color:var(--gray-700); }

        /* Modal – compact & scrollable */
        .modal {
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            z-index:1000;
            overflow-y:auto;
            padding:16px;
            animation:modalFade 0.3s ease;
        }
        @keyframes modalFade { from{opacity:0;} to{opacity:1;} }
        .modal-content {
            background:white;
            max-width:500px;
            margin:20px auto;
            padding:20px 24px;
            border-radius:var(--radius);
            position:relative;
            box-shadow:var(--shadow-xl);
            animation:modalSlide 0.3s ease;
            max-height:90vh;
            overflow-y:auto;
        }
        @keyframes modalSlide { from{transform:translateY(-20px); opacity:0;} to{transform:translateY(0); opacity:1;} }
        .close-modal {
            position:absolute;
            top:10px;
            right:14px;
            font-size:24px;
            cursor:pointer;
            color:var(--gray-500);
            transition:var(--transition);
            width:32px;
            height:32px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:50%;
            background:var(--gray-100);
        }
        .close-modal:hover { color:var(--gray-900); background:var(--gray-200); transform:rotate(90deg); }
        .modal-content h2 {
            font-size:18px;
            font-weight:700;
            margin-bottom:14px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .modal-content h2 i { color:var(--primary); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .form-group .checkbox-label {
            display:flex;
            align-items:center;
            gap:6px;
            font-weight:600;
            cursor:pointer;
            color:var(--gray-700);
            font-size:13px;
        }
        .form-group .checkbox-label input[type="checkbox"] { width:16px; height:16px; accent-color:var(--primary); cursor:pointer; }
        .btn-submit {
            width:100%;
            padding:10px;
            background:linear-gradient(135deg, var(--primary), var(--primary-dark));
            color:white;
            border:none;
            border-radius:var(--radius-sm);
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:var(--transition);
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            margin-top:4px;
        }
        .btn-submit:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(108,99,255,0.35); }
        .file-upload-wrap {
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .file-upload-wrap input[type="file"],
        .file-upload-wrap input[type="url"] {
            width:100%;
            padding:8px 12px;
            border:2px dashed var(--gray-300);
            border-radius:var(--radius-sm);
            background:var(--gray-100);
            cursor:pointer;
            font-size:13px;
            transition:var(--transition);
        }
        .file-upload-wrap input[type="file"]:hover,
        .file-upload-wrap input[type="url"]:hover {
            border-color:var(--primary);
            background:#EEF2FF;
        }
        .file-upload-wrap input[type="url"] { border-style:solid; }
        .file-preview-wrap {
            display:flex;
            align-items:center;
            gap:12px;
            margin-top:4px;
        }
        .file-preview {
            width:56px;
            height:56px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid var(--gray-300);
            background:var(--gray-200);
            flex-shrink:0;
        }
        .file-preview-placeholder {
            width:56px;
            height:56px;
            border-radius:50%;
            background:var(--gray-200);
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--gray-400);
            font-size:20px;
            flex-shrink:0;
            border:2px dashed var(--gray-300);
        }

        /* Toast */
        .toast {
            position:fixed;
            bottom:20px;
            left:50%;
            transform:translateX(-50%) translateY(100px);
            background:var(--gray-900);
            color:white;
            padding:12px 24px;
            border-radius:var(--radius-sm);
            font-weight:600;
            z-index:2000;
            opacity:0;
            transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
            pointer-events:none;
            box-shadow:var(--shadow-xl);
            max-width:90%;
            text-align:center;
            font-size:14px;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.success { background:linear-gradient(135deg, var(--success), #27AE60); }
        .toast.error { background:linear-gradient(135deg, var(--danger), #C0392B); }
        .toast.info { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); }

        /* Responsive */
        @media (max-width:768px) {
            .sidebar { width:56px; }
            .sidebar-header .brand, .sidebar-nav span { display:none; }
            .sidebar-header { padding:12px; justify-content:center; }
            .sidebar-header .btn-logout { display:none; }
            .nav-item { justify-content:center; padding:10px; }
            .nav-item i { margin:0; font-size:17px; }
            .nav-item .badge { display:none; }
            .main-content { margin-left:56px; padding:12px 16px; }
            .stats-grid { grid-template-columns:1fr 1fr; gap:10px; }
            .stat-card { padding:12px; }
            .stat-value { font-size:18px; }
            .form-row { grid-template-columns:1fr; }
            .worker-item { flex-direction:column; align-items:stretch; }
            .worker-item-left { flex-wrap:wrap; }
            .worker-actions { justify-content:flex-end; margin-top:6px; }
            .transaction-item { flex-direction:column; align-items:stretch; }
            .login-container { padding:28px 20px; }
            .modal-content { margin:12px auto; padding:18px; }
            .file-upload-wrap input[type="file"],
            .file-upload-wrap input[type="url"] { font-size:12px; }
        }
        @media (max-width:480px) {
            .stats-grid { grid-template-columns:1fr; }
            .page-header { flex-direction:column; align-items:flex-start; }
            .page-header .btn-primary { width:100%; justify-content:center; }
            .login-header .icon-wrap { width:52px; height:52px; }
            .login-header .icon-wrap i { font-size:22px; }
            .login-header h2 { font-size:20px; }
            .toast { padding:10px 16px; font-size:13px; bottom:12px; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <div class="icon-wrap"><i class="fas fa-user-shield"></i></div>
                <h2>Admin Login</h2>
                <p>Digital Delala Management Panel</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" placeholder="admin@digitaldelala.com" required />
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required />
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboardScreen" class="dashboard-screen" style="display:none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
                <span class="brand">Digital Delala</span>
                <button id="logoutBtn" class="btn-logout" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
                <button class="nav-item" data-tab="workers"><i class="fas fa-users"></i><span>Workers</span><span class="badge" id="workerBadge">0</span></button>
                <button class="nav-item" data-tab="transactions"><i class="fas fa-receipt"></i><span>Transactions</span><span class="badge" id="transactionBadge">0</span></button>
                <!-- NEW: Pending Payments -->
                <button class="nav-item" data-tab="pending"><i class="fas fa-clock"></i><span>Pending Payments</span><span class="badge" id="pendingBadge">0</span></button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Dashboard -->
            <div id="dashboardTab" class="tab-content active">
                <div class="page-header"><h2><i class="fas fa-chart-pie"></i> Dashboard Overview</h2></div>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><span class="stat-label">Total Workers</span><span class="stat-value" id="totalWorkers">0</span></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-check"></i></div><div class="stat-info"><span class="stat-label">Available</span><span class="stat-value" id="availableWorkers">0</span></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div><div class="stat-info"><span class="stat-label">Total Revenue</span><span class="stat-value" id="totalRevenue">0 ETB</span></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-exchange-alt"></i></div><div class="stat-info"><span class="stat-label">Transactions</span><span class="stat-value" id="totalTransactions">0</span></div></div>
                </div>
            </div>

            <!-- Workers -->
            <div id="workersTab" class="tab-content">
                <div class="page-header">
                    <h2><i class="fas fa-users"></i> Manage Workers</h2>
                    <button id="addWorkerBtn" class="btn-primary"><i class="fas fa-plus"></i> Add Worker</button>
                </div>
                <div id="workersList" class="workers-list"></div>
            </div>

            <!-- Transactions -->
            <div id="transactionsTab" class="tab-content">
                <div class="page-header"><h2><i class="fas fa-receipt"></i> Transaction History</h2></div>
                <div id="transactionsList" class="transactions-list"></div>
            </div>

            <!-- NEW: Pending Payments -->
            <div id="pendingTab" class="tab-content">
                <div class="page-header"><h2><i class="fas fa-clock"></i> Pending Payments</h2></div>
                <div id="pendingList" class="pending-list"></div>
            </div>
        </div>
    </div>

    <!-- ===== WORKER MODAL ===== -->
    <div id="workerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modalTitle"><i class="fas fa-user-plus"></i> Add Worker</h2>
            <form id="workerForm" enctype="multipart/form-data">
                <input type="hidden" id="workerId" />
                <div class="form-group">
                    <label for="workerName">Full Name</label>
                    <input type="text" id="workerName" placeholder="Worker's full name" required />
                </div>
                <div class="form-group">
                    <label for="workerProfession">Profession</label>
                    <input type="text" id="workerProfession" placeholder="e.g., Plumber, Electrician" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="workerExperience">Experience (Years)</label>
                        <input type="number" id="workerExperience" placeholder="5" required min="0" />
                    </div>
                    <div class="form-group">
                        <label for="workerPrice">Price (ETB)</label>
                        <input type="number" id="workerPrice" placeholder="500" required min="0" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="workerLocation">Location</label>
                    <input type="text" id="workerLocation" placeholder="e.g., Addis Ababa" required />
                </div>
                <div class="form-group">
                    <label for="workerPhone">Phone Number</label>
                    <input type="text" id="workerPhone" placeholder="09XXXXXXXX" required />
                </div>
                <div class="form-group">
                    <label for="workerDescription">Description</label>
                    <textarea id="workerDescription" placeholder="Brief description about the worker" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Photo</label>
                    <div class="file-upload-wrap">
                        <input type="file" id="workerImage" accept="image/*" />
                        <input type="url" id="workerImageUrl" placeholder="Or paste image URL..." />
                        <div class="file-preview-wrap">
                            <div id="imagePreview" class="file-preview-placeholder"><i class="fas fa-camera"></i></div>
                            <span style="font-size:12px; color:var(--gray-500);">File or URL (URL takes priority)</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="workerAvailable" checked />
                        Available for work
                    </label>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Save Worker</button>
            </form>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ===== CONFIG =====
        const API_URL = window.location.origin + '/api';

        // ===== DOM REFS =====
        const loginScreen = document.getElementById('loginScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const addWorkerBtn = document.getElementById('addWorkerBtn');
        const workerForm = document.getElementById('workerForm');
        const workerModal = document.getElementById('workerModal');
        const modalTitle = document.getElementById('modalTitle');
        const workerId = document.getElementById('workerId');
        const toast = document.getElementById('toast');
        const workerImageInput = document.getElementById('workerImage');
        const workerImageUrlInput = document.getElementById('workerImageUrl');
        const imagePreview = document.getElementById('imagePreview');

        let authToken = localStorage.getItem('adminToken');
        let allWorkers = [];
        let currentImageFile = null;
        let currentImageUrl = '';

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.className = 'toast'; }, 3500);
        }

        // ===== AUTH =====
        function checkAuth() {
            if (authToken) {
                loginScreen.style.display = 'none';
                dashboardScreen.style.display = 'flex';
                loadDashboard();
                loadWorkers();
                loadTransactions();
                loadPending();
            } else {
                loginScreen.style.display = 'flex';
                dashboardScreen.style.display = 'none';
            }
        }

        // ===== LOGIN =====
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            try {
                const res = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('adminToken', authToken);
                    showToast('Login successful!', 'success');
                    checkAuth();
                } else {
                    showToast(data.error || 'Invalid credentials', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
                console.error(err);
            }
        });

        // ===== LOGOUT =====
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            authToken = null;
            checkAuth();
            showToast('Logged out', 'info');
        });

        // ===== API REQUEST =====
        async function apiRequest(url, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
            if (options.body && options.body instanceof FormData) {
                delete headers['Content-Type'];
            }
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem('adminToken');
                authToken = null;
                checkAuth();
                showToast('Session expired. Please login again.', 'error');
                throw new Error('Unauthorized');
            }
            return response.json();
        }

        // ===== LOAD DASHBOARD =====
        async function loadDashboard() {
            try {
                const data = await apiRequest(`${API_URL}/admin/stats`);
                if (data.success) {
                    document.getElementById('totalWorkers').textContent = data.data.totalWorkers;
                    document.getElementById('availableWorkers').textContent = data.data.availableWorkers;
                    document.getElementById('totalRevenue').textContent = `${data.data.totalRevenue} ETB`;
                    document.getElementById('totalTransactions').textContent = data.data.totalTransactions;
                    document.getElementById('workerBadge').textContent = data.data.totalWorkers;
                    document.getElementById('transactionBadge').textContent = data.data.totalTransactions;
                }
            } catch (err) { console.error(err); }
        }

        // ===== LOAD WORKERS =====
        async function loadWorkers() {
            try {
                const data = await apiRequest(`${API_URL}/workers`);
                if (data.success) {
                    allWorkers = data.data;
                    renderWorkers(data.data);
                }
            } catch (err) { console.error(err); }
        }

        // ===== RENDER WORKERS =====
        function renderWorkers(workers) {
            const container = document.getElementById('workersList');
            if (!workers.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <h3>No workers registered</h3>
                        <p style="color:var(--gray-500);">Click "Add Worker" to get started</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = workers.map(w => {
                let imgSrc = null;
                if (w.image) {
                    if (w.image.startsWith('http://') || w.image.startsWith('https://')) {
                        imgSrc = w.image;
                    } else {
                        imgSrc = `/uploads/${w.image}`;
                    }
                }
                return `
                <div class="worker-item">
                    <div class="worker-item-left">
                        ${imgSrc ? `<img class="worker-thumb" src="${imgSrc}" alt="${w.name}" />` :
                            `<div class="worker-thumb-placeholder"><i class="fas fa-user"></i></div>`}
                        <div class="worker-info">
                            <div class="name">${w.name}</div>
                            <div class="profession">${w.profession}</div>
                            <div class="details">
                                <span><i class="fas fa-map-marker-alt" style="color:var(--primary);"></i> ${w.location}</span>
                                <span><i class="fas fa-calendar-alt" style="color:var(--primary);"></i> ${w.experience} yrs</span>
                                <span><i class="fas fa-tag" style="color:var(--primary);"></i> ${w.price} ETB</span>
                                <span><i class="fas fa-phone" style="color:var(--primary);"></i> ${w.phone}</span>
                                ${!w.isAvailable ? '<span class="unavailable"><i class="fas fa-times-circle"></i> Unavailable</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="worker-actions">
                        <button class="btn-edit" onclick="editWorker('${w._id}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="btn-danger" onclick="deleteWorker('${w._id}')"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>
            `}).join('');
        }

        // ===== LOAD TRANSACTIONS =====
        async function loadTransactions() {
            try {
                const data = await apiRequest(`${API_URL}/admin/transactions`);
                if (data.success) {
                    const container = document.getElementById('transactionsList');
                    const txs = data.data;
                    if (!txs.length) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-receipt"></i>
                                <h3>No transactions yet</h3>
                                <p style="color:var(--gray-500);">Transactions appear when bosses pay for contacts</p>
                            </div>
                        `;
                        return;
                    }
                    container.innerHTML = txs.map(t => `
                        <div class="transaction-item">
                            <div class="transaction-info">
                                <div class="worker">${t.workerId?.name || 'Unknown'}</div>
                                <div class="boss">${t.bossName} (${t.bossPhone})</div>
                                <span class="id">TXN: ${t.telebirrTransactionId}</span>
                                <span class="status-badge ${t.status}">${t.status}</span>
                            </div>
                            <div class="transaction-amount">${t.amount} ETB</div>
                        </div>
                    `).join('');
                }
            } catch (err) { console.error(err); }
        }

        // ===== LOAD PENDING =====
        async function loadPending() {
            try {
                const data = await apiRequest(`${API_URL}/admin/transactions/pending`);
                if (data.success) {
                    const container = document.getElementById('pendingList');
                    const pendings = data.data;
                    document.getElementById('pendingBadge').textContent = pendings.length;
                    if (!pendings.length) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-check-circle"></i>
                                <h3>No pending payments</h3>
                                <p style="color:var(--gray-500);">All payments are confirmed</p>
                            </div>
                        `;
                        return;
                    }
                    container.innerHTML = pendings.map(t => `
                        <div class="pending-item" id="pending-${t._id}">
                            <div class="transaction-info">
                                <div class="worker">${t.workerId?.name || 'Unknown'} (${t.workerId?.profession || ''})</div>
                                <div class="boss">${t.bossName} (${t.bossPhone})</div>
                                <span class="id">TXN: ${t.telebirrTransactionId}</span>
                                <span class="status-badge pending">Pending</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:12px;">
                                <span class="transaction-amount">${t.amount} ETB</span>
                                <button class="btn-success" onclick="confirmPayment('${t._id}')"><i class="fas fa-check"></i> Confirm</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) { console.error(err); }
        }

        // ===== CONFIRM PAYMENT =====
        async function confirmPayment(transactionId) {
            if (!confirm('Confirm this payment? The worker\'s phone number will be released to the customer.')) return;
            try {
                const data = await apiRequest(`${API_URL}/admin/transactions/${transactionId}/confirm`, {
                    method: 'PUT'
                });
                if (data.success) {
                    showToast('Payment confirmed! Phone number released.', 'success');
                    loadPending();
                    loadTransactions();
                    loadDashboard();
                } else {
                    showToast(data.error || 'Error confirming payment', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
                console.error(err);
            }
        }

        // ===== EDIT WORKER =====
        function editWorker(id) {
            const w = allWorkers.find(x => x._id === id);
            if (!w) return;
            modalTitle.innerHTML = '<i class="fas fa-user-edit"></i> Edit Worker';
            workerId.value = w._id;
            document.getElementById('workerName').value = w.name;
            document.getElementById('workerProfession').value = w.profession;
            document.getElementById('workerExperience').value = w.experience;
            document.getElementById('workerPrice').value = w.price;
            document.getElementById('workerLocation').value = w.location;
            document.getElementById('workerPhone').value = w.phone;
            document.getElementById('workerDescription').value = w.description || '';
            document.getElementById('workerAvailable').checked = w.isAvailable;
            if (w.image) {
                let imgUrl = w.image;
                if (!imgUrl.startsWith('http://') && !imgUrl.startsWith('https://')) {
                    imgUrl = `/uploads/${imgUrl}`;
                }
                imagePreview.innerHTML = `<img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
                imagePreview.className = 'file-preview';
                if (w.image.startsWith('http://') || w.image.startsWith('https://')) {
                    workerImageUrlInput.value = w.image;
                } else {
                    workerImageUrlInput.value = '';
                }
            } else {
                imagePreview.innerHTML = '<i class="fas fa-camera"></i>';
                imagePreview.className = 'file-preview-placeholder';
                workerImageUrlInput.value = '';
            }
            currentImageFile = null;
            currentImageUrl = workerImageUrlInput.value;
            workerModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // ===== DELETE WORKER =====
        async function deleteWorker(id) {
            if (!confirm('Delete this worker permanently?')) return;
            try {
                const data = await apiRequest(`${API_URL}/admin/workers/${id}`, { method: 'DELETE' });
                if (data.success) {
                    showToast('Worker deleted', 'success');
                    loadWorkers();
                    loadDashboard();
                } else {
                    showToast(data.error || 'Error deleting', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
                console.error(err);
            }
        }

        // ===== IMAGE PREVIEW =====
        workerImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) {
                updatePreviewFromUrl();
                return;
            }
            currentImageFile = file;
            currentImageUrl = '';
            workerImageUrlInput.value = '';
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
                imagePreview.className = 'file-preview';
            };
            reader.readAsDataURL(file);
        });

        workerImageUrlInput.addEventListener('input', function() {
            const url = this.value.trim();
            currentImageUrl = url;
            if (url) {
                currentImageFile = null;
                workerImageInput.value = '';
                imagePreview.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
                imagePreview.className = 'file-preview';
            } else {
                if (!currentImageFile) {
                    imagePreview.innerHTML = '<i class="fas fa-camera"></i>';
                    imagePreview.className = 'file-preview-placeholder';
                }
            }
        });

        function updatePreviewFromUrl() {
            const url = workerImageUrlInput.value.trim();
            if (url) {
                imagePreview.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
                imagePreview.className = 'file-preview';
                currentImageUrl = url;
                currentImageFile = null;
            } else {
                imagePreview.innerHTML = '<i class="fas fa-camera"></i>';
                imagePreview.className = 'file-preview-placeholder';
                currentImageUrl = '';
            }
        }

        // ===== ADD WORKER =====
        addWorkerBtn.addEventListener('click', () => {
            modalTitle.innerHTML = '<i class="fas fa-user-plus"></i> Add Worker';
            workerForm.reset();
            workerId.value = '';
            document.getElementById('workerAvailable').checked = true;
            currentImageFile = null;
            currentImageUrl = '';
            workerImageUrlInput.value = '';
            workerImageInput.value = '';
            imagePreview.innerHTML = '<i class="fas fa-camera"></i>';
            imagePreview.className = 'file-preview-placeholder';
            workerModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        });

        // ===== SAVE WORKER =====
        workerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = workerId.value;
            const formData = new FormData();
            formData.append('name', document.getElementById('workerName').value.trim());
            formData.append('profession', document.getElementById('workerProfession').value.trim());
            formData.append('experience', parseInt(document.getElementById('workerExperience').value));
            formData.append('price', parseInt(document.getElementById('workerPrice').value));
            formData.append('location', document.getElementById('workerLocation').value.trim());
            formData.append('phone', document.getElementById('workerPhone').value.trim());
            formData.append('description', document.getElementById('workerDescription').value.trim());
            formData.append('isAvailable', document.getElementById('workerAvailable').checked ? 'true' : 'false');

            const url = workerImageUrlInput.value.trim();
            if (currentImageFile) {
                formData.append('image', currentImageFile);
            } else if (url) {
                formData.append('imageUrl', url);
            }

            const method = id ? 'PUT' : 'POST';
            const urlEndpoint = id ? `${API_URL}/admin/workers/${id}` : `${API_URL}/admin/workers`;

            try {
                const data = await apiRequest(urlEndpoint, {
                    method: method,
                    body: formData
                });
                if (data.success) {
                    showToast(id ? 'Worker updated' : 'Worker added', 'success');
                    workerModal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                    loadWorkers();
                    loadDashboard();
                } else {
                    showToast(data.error || 'Error saving worker', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
                console.error(err);
            }
        });

        // ===== TAB NAV =====
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab + 'Tab').classList.add('active');
                if (tab === 'workers') loadWorkers();
                if (tab === 'transactions') loadTransactions();
                if (tab === 'dashboard') loadDashboard();
                if (tab === 'pending') loadPending();
            });
        });

        // ===== CLOSE MODALS =====
        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.onclick = function() {
                const modal = this.closest('.modal');
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            };
        });
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && workerModal.style.display === 'block') {
                workerModal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });

        // ===== INIT =====
        checkAuth();
        setInterval(() => {
            if (authToken) apiRequest(`${API_URL}/admin/stats`).catch(() => {});
        }, 5 * 60 * 1000);

        console.log('🔐 Digital Delala Admin Panel (with Payment Confirmation)');
    </script>
</body>
</html>
